<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你是哪一種皮克敏？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-dark: #2d6a4f;
    --green-mid: #52b788;
    --green-light: #d8f3dc;
    --green-pale: #f0faf2;
    --soil: #a07850;
    --soil-light: #f5e6d3;
    --white: #ffffff;
    --text-dark: #1b3a2d;
    --text-mid: #3d6b52;
    --text-light: #7aab8a;
    --shadow: rgba(45, 106, 79, 0.15);
    --radius-sm: 12px;
    --radius-md: 20px;
    --radius-lg: 32px;
    --radius-xl: 48px;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--green-pale);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* Grass decoration */
  body::before {
    content: '';
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: repeating-linear-gradient(
      90deg,
      #52b788 0px, #52b788 8px,
      #3a9a6e 8px, #3a9a6e 16px,
      #2d8a5f 16px, #2d8a5f 24px
    );
    clip-path: polygon(
      0% 100%, 2% 40%, 4% 100%, 6% 30%, 8% 100%,
      10% 45%, 12% 100%, 14% 35%, 16% 100%, 18% 50%,
      20% 100%, 22% 38%, 24% 100%, 26% 42%, 28% 100%,
      30% 33%, 32% 100%, 34% 48%, 36% 100%, 38% 36%,
      40% 100%, 42% 44%, 44% 100%, 46% 31%, 48% 100%,
      50% 47%, 52% 100%, 54% 40%, 56% 100%, 58% 35%,
      60% 100%, 62% 43%, 64% 100%, 66% 38%, 68% 100%,
      70% 46%, 72% 100%, 74% 33%, 76% 100%, 78% 41%,
      80% 100%, 82% 37%, 84% 100%, 86% 49%, 88% 100%,
      90% 36%, 92% 100%, 94% 43%, 96% 100%, 98% 38%,
      100% 100%
    );
    z-index: 0;
    pointer-events: none;
  }

  /* Floating leaves */
  .leaf {
    position: fixed;
    width: 20px;
    height: 20px;
    border-radius: 50% 0 50% 0;
    opacity: 0.25;
    animation: floatLeaf linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  .leaf:nth-child(1) { background: #52b788; top: 10%; left: 5%; animation-duration: 8s; animation-delay: 0s; }
  .leaf:nth-child(2) { background: #3a9a6e; top: 20%; right: 8%; animation-duration: 11s; animation-delay: 2s; width: 14px; height: 14px; }
  .leaf:nth-child(3) { background: #52b788; top: 60%; left: 3%; animation-duration: 9s; animation-delay: 1s; width: 16px; height: 16px; }
  .leaf:nth-child(4) { background: #2d6a4f; top: 40%; right: 5%; animation-duration: 13s; animation-delay: 4s; }
  .leaf:nth-child(5) { background: #52b788; top: 75%; left: 12%; animation-duration: 7s; animation-delay: 0.5s; width: 12px; height: 12px; }

  @keyframes floatLeaf {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.25; }
    50% { transform: translateY(-20px) rotate(180deg); opacity: 0.15; }
    100% { transform: translateY(0) rotate(360deg); opacity: 0.25; }
  }

  /* Card container */
  .card {
    background: white;
    border-radius: var(--radius-lg);
    padding: 40px 36px;
    box-shadow: 0 8px 40px var(--shadow), 0 2px 8px rgba(0,0,0,0.06);
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 1;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ======================== SCREEN MANAGEMENT ======================== */
  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; align-items: center; width: 100%; }

  /* ======================== INTRO SCREEN ======================== */
  .intro-badge {
    background: var(--green-light);
    color: var(--green-dark);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 99px;
    margin-bottom: 20px;
    display: inline-block;
  }

  .intro-illustration {
    width: 100%;
    height: 190px;
    margin: 2px auto 22px;
    overflow: visible;
  }
  .pikmin-bunch {
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    padding: 16px 0 8px;
  }
  .pikmin-icon {
    --pk: #e84545;
    --pk-dark: #9b1c1c;
    --stem: #5c9d50;
    --leaf: #75c94b;
    --flower: #f5f7fb;
    position: relative;
    width: 40px;
    height: 144px;
    flex: 0 0 40px;
    animation: pkBob 2.7s ease-in-out infinite;
    transform-origin: center bottom;
    filter: drop-shadow(0 8px 10px rgba(45, 106, 79, 0.14));
  }
  @keyframes pkBob {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -7px; }
  }
  .pikmin-icon:nth-child(2n) { animation-delay: .25s; }
  .pikmin-icon:nth-child(3n) { animation-delay: .5s; }
  .pikmin-icon.pk-red { --pk:#f4453f; --pk-dark:#b8201d; height: 120px; margin-left: 2px; }
  .pikmin-icon.pk-yellow { --pk:#ffc928; --pk-dark:#c18b00; height: 114px; }
  .pikmin-icon.pk-blue { --pk:#126be6; --pk-dark:#0f3f96; height: 117px; }
  .pikmin-icon.pk-purple { --pk:#8a37bd; --pk-dark:#542074; width: 52px; flex-basis:52px; height: 118px; }
  .pikmin-icon.pk-white { --pk:#f4f7ef; --pk-dark:#d6dccc; width: 32px; flex-basis:32px; height: 106px; margin-right: 2px; }
  .pikmin-icon.pk-rock { --pk:#25282d; --pk-dark:#111316; width: 56px; flex-basis:56px; height: 140px; }
  .pikmin-icon.pk-winged { --pk:#ff5ca8; --pk-dark:#c42e76; width: 32px; flex-basis:32px; height: 150px; margin-bottom: 26px; }
  .pikmin-icon.pk-ice { --pk:#9be8e8; --pk-dark:#54bfc2; width: 48px; flex-basis:48px; height: 118px; }

  .p-stem {
    position:absolute;
    left:50%;
    bottom: 75px;
    width: 4px;
    height: 42px;
    margin-left: -2px;
    background: linear-gradient(180deg, #7bc768, var(--stem));
    border-radius: 99px;
    transform: rotate(4deg);
    transform-origin: bottom center;
    z-index: 1;
  }
  .p-leaf {
    position:absolute;
    left:50%;
    bottom: 113px;
    width: 23px;
    height: 14px;
    margin-left: 1px;
    background: radial-gradient(circle at 28% 30%, #d5ff73 0 16%, var(--leaf) 45%, #48a83d 100%);
    border-radius: 80% 16% 80% 18%;
    transform: rotate(-24deg);
    transform-origin: left bottom;
    z-index: 2;
  }
  .p-flower {
    position:absolute;
    left:50%;
    bottom: 112px;
    width: 28px;
    height: 28px;
    margin-left: -14px;
    z-index: 2;
    display: none;
  }
  .p-flower::before,
  .p-flower::after {
    content:'';
    position:absolute;
    inset: 5px;
    background: var(--flower);
    border-radius: 70% 30% 70% 30%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.04);
  }
  .p-flower::before { transform: rotate(0deg); }
  .p-flower::after { transform: rotate(70deg); }
  .p-bud {
    position:absolute;
    left:50%;
    bottom: 116px;
    width: 20px;
    height: 24px;
    margin-left: -10px;
    background: radial-gradient(circle at 32% 22%, #ff79ba, var(--flower));
    border-radius: 56% 56% 48% 48%;
    display: none;
    z-index: 2;
  }
  .p-head {
    position:absolute;
    left:50%;
    bottom: 38px;
    width: 28px;
    height: 36px;
    margin-left: -14px;
    background: radial-gradient(circle at 34% 25%, rgba(255,255,255,.36), transparent 24%), var(--pk);
    border-radius: 54% 54% 48% 48%;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.08);
    z-index: 3;
  }
  .p-body {
    position:absolute;
    left:50%;
    bottom: 15px;
    width: 18px;
    height: 30px;
    margin-left: -9px;
    background: radial-gradient(circle at 34% 25%, rgba(255,255,255,.24), transparent 24%), var(--pk);
    border-radius: 45% 45% 42% 42%;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.08);
    z-index: 2;
  }
  .p-eye-row {
    position:absolute;
    left:50%;
    bottom: 58px;
    width: 23px;
    margin-left: -11.5px;
    display:flex;
    justify-content:space-between;
    z-index: 6;
  }
  .p-eye {
    width: 7px;
    height: 9px;
    background:#fff;
    border: 1px solid rgba(0,0,0,.16);
    border-radius: 50%;
    position:relative;
  }
  .p-eye::after {
    content:'';
    position:absolute;
    left:2px;
    top:3px;
    width:3px;
    height:3px;
    background:#151515;
    border-radius:50%;
  }
  .p-feet {
    position:absolute;
    left:50%;
    bottom: 7px;
    width: 24px;
    margin-left: -12px;
    display:flex;
    justify-content:space-between;
    z-index:1;
  }
  .p-foot {
    width: 9px;
    height: 7px;
    background: var(--pk-dark);
    border-radius: 99px 99px 60% 60%;
  }
  .p-arm {
    position:absolute;
    bottom: 27px;
    width: 16px;
    height: 3px;
    background: var(--pk-dark);
    border-radius:99px;
    z-index:1;
  }
  .p-arm.left { left: 9px; transform: rotate(28deg); }
  .p-arm.right { right: 9px; transform: rotate(-28deg); }
  .p-ear, .p-nose, .p-wing, .p-spike, .p-facet { position:absolute; display:none; }

  .pk-red .p-nose {
    display:block;
    left:50%; bottom: 52px;
    width: 14px; height: 9px;
    margin-left: -7px;
    background: var(--pk-dark);
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    z-index: 5;
  }
  .pk-blue .p-head { width: 26px; height: 34px; margin-left:-13px; }
  .pk-blue .p-nose {
    display:block;
    left:50%; bottom: 50px;
    width: 10px; height: 7px;
    margin-left: -5px;
    background: #0f3f96;
    border-radius: 50% 50% 60% 60%;
    z-index: 5;
  }
  .pk-yellow .p-ear {
    display:block;
    width: 18px;
    height: 17px;
    bottom: 55px;
    background: var(--pk);
    clip-path: polygon(0 50%, 100% 0, 78% 100%);
    z-index: 2;
  }
  .pk-yellow .p-ear.left { left: 3px; transform: rotate(12deg) scaleX(-1); }
  .pk-yellow .p-ear.right { right: 3px; transform: rotate(-12deg); }
  .pk-yellow .p-flower { display:block; --flower:#f7f8ec; }
  .pk-yellow .p-leaf { display:none; }
  .pk-white .p-eye { background:#e91b35; width:8px; height:8px; border:none; box-shadow:0 0 0 1px rgba(255,255,255,.35); }
  .pk-white .p-eye::after { background:#ff8b9b; left:2px; top:2px; width:2px; height:2px; }
  .pk-white .p-head { width:25px; height:34px; margin-left:-12.5px; }
  .pk-white .p-body { width:14px; height:28px; margin-left:-7px; }
  .pk-white .p-flower { display:block; --flower:#d01679; transform: scale(.8); }
  .pk-white .p-leaf { display:none; }
  .pk-purple .p-head { width:40px; height:40px; margin-left:-20px; border-radius:54% 54% 45% 45%; }
  .pk-purple .p-body { width:29px; height:34px; margin-left:-14.5px; }
  .pk-purple .p-eye-row { width:30px; margin-left:-15px; }
  .pk-purple .p-bud { display:block; --flower:#d81788; }
  .pk-purple .p-leaf { display:none; }
  .pk-purple .p-spike {
    display:block;
    bottom: 58px;
    width: 16px;
    height: 2px;
    background: var(--pk-dark);
    border-radius: 99px;
    z-index:1;
  }
  .pk-purple .p-spike.s1 { left: 0; transform: rotate(25deg); }
  .pk-purple .p-spike.s2 { left: 1px; bottom: 68px; transform: rotate(0deg); }
  .pk-purple .p-spike.s3 { right: 0; transform: rotate(-25deg); }
  .pk-purple .p-spike.s4 { right: 1px; bottom: 68px; transform: rotate(0deg); }
  .pk-rock .p-head,
  .pk-rock .p-body {
    background: linear-gradient(135deg, #4b4f56, #16181c 65%, #050607);
    border-radius: 18% 32% 20% 38%;
    clip-path: polygon(16% 8%, 72% 0, 98% 36%, 76% 95%, 22% 100%, 0 52%);
  }
  .pk-rock .p-head { width: 46px; height: 50px; margin-left:-23px; bottom:34px; }
  .pk-rock .p-body { width: 33px; height: 30px; margin-left:-16px; bottom:15px; }
  .pk-rock .p-eye-row { bottom:58px; width:30px; margin-left:-15px; }
  .pk-rock .p-facet {
    display:block;
    width: 22px; height: 22px;
    left:50%; bottom:52px;
    margin-left:-4px;
    background:rgba(255,255,255,.16);
    clip-path: polygon(0 0, 100% 15%, 55% 100%);
    z-index:4;
  }
  .pk-rock .p-stem { height:58px; bottom:81px; transform: rotate(9deg); }
  .pk-rock .p-leaf { bottom:136px; width:34px; height:19px; }
  .pk-winged .p-head { width:24px; height:24px; margin-left:-12px; bottom:54px; border-radius:50%; }
  .pk-winged .p-body { width:18px; height:28px; margin-left:-9px; bottom:24px; background: repeating-linear-gradient(0deg, rgba(255,255,255,.38) 0 3px, transparent 3px 8px), var(--pk); border-radius:48% 48% 42% 42%; }
  .pk-winged .p-eye-row { width:32px; margin-left:-16px; bottom:62px; }
  .pk-winged .p-eye { width:12px; height:12px; background:#00a1c8; }
  .pk-winged .p-wing {
    display:block;
    bottom: 43px;
    width: 17px;
    height: 25px;
    background: rgba(255,255,255,.58);
    border: 1px solid rgba(100,100,100,.14);
    border-radius: 80% 20% 80% 20%;
    z-index: 1;
  }
  .pk-winged .p-wing.left { left: 1px; transform: rotate(-18deg) scaleX(-1); }
  .pk-winged .p-wing.right { right: 1px; transform: rotate(18deg); }
  .pk-winged .p-stem { height:58px; bottom:76px; background: linear-gradient(180deg,#ffb3d0,#f06aa9); transform: rotate(-8deg); }
  .pk-winged .p-leaf { bottom:130px; }
  .pk-ice .p-head,
  .pk-ice .p-body {
    background: linear-gradient(135deg, rgba(255,255,255,.72), transparent 28%), linear-gradient(160deg,#bff8f8,#69d6da);
    clip-path: polygon(20% 5%, 80% 0, 100% 35%, 88% 80%, 46% 100%, 8% 78%, 0 36%);
    border-radius: 22%;
  }
  .pk-ice .p-head { width:34px; height:38px; margin-left:-17px; }
  .pk-ice .p-body { width:28px; height:32px; margin-left:-14px; }
  .pk-ice .p-eye-row { width:26px; margin-left:-13px; }
  .pk-ice .p-flower { display:block; --flower:#f2d315; transform: rotate(22deg) scale(.9); }
  .pk-ice .p-leaf { display:none; }

  .name-field {
    width: 100%;
    margin: -10px 0 16px;
    text-align: left;
  }
  .name-field label {
    display: block;
    font-size: 13px;
    color: var(--text-mid);
    font-weight: 800;
    margin: 0 0 8px 4px;
  }
  .name-input {
    width: 100%;
    border: 2.5px solid var(--green-light);
    background: #fbfffc;
    border-radius: var(--radius-md);
    padding: 14px 16px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--text-dark);
    outline: none;
    transition: all .2s ease;
  }
  .name-input:focus {
    border-color: var(--green-mid);
    box-shadow: 0 0 0 4px rgba(82,183,136,.16);
  }
  @media (max-width: 520px) {
    .pikmin-bunch { gap: 1px; padding-top: 22px; transform: scale(.88); transform-origin: center bottom; }
    .intro-illustration { height: 150px; margin-bottom: 16px; }
    .card { padding: 34px 24px; }
  }

  .intro-title {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--text-dark);
    text-align: center;
    line-height: 1.25;
    margin-bottom: 14px;
    letter-spacing: -0.5px;
    -webkit-text-stroke: 1px rgba(45,106,79,0.15);
  }
  .intro-title span { color: var(--green-dark); }

  .intro-desc {
    font-size: 15px;
    color: var(--text-mid);
    text-align: center;
    line-height: 1.7;
    margin-bottom: 32px;
  }

  .btn-primary {
    display: block;
    width: 100%;
    padding: 18px;
    background: var(--green-dark);
    color: white;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 20px;
    font-weight: 900;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    letter-spacing: 1px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.2);
    box-shadow: 0 5px 0 #1a3d2b;
  }
  .btn-primary:hover { background: #1e4d3a; transform: translateY(-2px); box-shadow: 0 7px 0 #1a3d2b; }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #1a3d2b; }

  .intro-meta {
    font-size: 13px;
    color: var(--text-light);
    text-align: center;
    margin-top: 16px;
  }

  /* ======================== QUESTION SCREEN ======================== */
  .progress-wrap {
    margin-bottom: 28px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-light);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 8px;
    background: var(--green-light);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #52b788, #2d6a4f);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .question-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--green-mid);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .question-text {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--text-dark);
    line-height: 1.4;
    margin-bottom: 28px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .option-btn {
    padding: 15px 13px;
    background: var(--green-pale);
    border: 2.5px solid var(--green-light);
    border-radius: var(--radius-md);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.4;
    text-align: center;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 3px 0 #b7dcc4;
  }
  .option-btn:hover {
    background: var(--green-light);
    border-color: var(--green-mid);
    transform: translateY(-2px);
    box-shadow: 0 5px 0 #9dccb0;
    color: var(--green-dark);
  }
  .option-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #9dccb0; }
  .option-btn.selected {
    background: var(--green-dark);
    border-color: var(--green-dark);
    color: white;
    transform: translateY(2px);
    box-shadow: 0 1px 0 #1a3d2b;
  }
  .option-emoji { display: none; }

  /* ======================== LOADING SCREEN ======================== */
  .loading-screen {
    text-align: center;
  }
  .loading-circles {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 30px 0;
  }
  .loading-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    animation: loadBounce 1.2s ease-in-out infinite;
  }
  .loading-dot:nth-child(1) { background: #e84545; animation-delay: 0s; }
  .loading-dot:nth-child(2) { background: #f5c842; animation-delay: 0.15s; }
  .loading-dot:nth-child(3) { background: #4a90d9; animation-delay: 0.3s; }
  .loading-dot:nth-child(4) { background: #8b5cf6; animation-delay: 0.45s; }
  .loading-dot:nth-child(5) { background: #f472b6; animation-delay: 0.6s; }
  .loading-dot:nth-child(6) { background: #87ceeb; animation-delay: 0.75s; }

  @keyframes loadBounce {
    0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
    40% { transform: scale(1.3); opacity: 1; }
  }

  .loading-title {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--text-dark);

// ======================== QUIZ LOGIC ========================
function startQuiz() {
  const input = document.getElementById('player-name');
  const typedName = input ? input.value.trim() : '';
  if (!typedName) {
    showToast('請先輸入名字，皮克敏需要知道今天跟誰出任務 🌱');
    if (input) input.focus();
    return;
  }
  playerName = typedName;
  currentQuestion = 0;
  scores = [0,0,0,0,0,0,0,0];
  showScreen('question');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQuestion];
  const qNum = currentQuestion + 1;
  const total = QUESTIONS.length;
  document.getElementById('q-num').textContent = 'QUESTION ' + String(qNum).padStart(2,'0');
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-progress-text').textContent = '第 ' + qNum + ' 題';
  document.getElementById('q-progress-count').textContent = qNum + ' / ' + total;
  document.getElementById('q-progress-fill').style.width = (qNum / total * 100) + '%';

  const optDiv = document.getElementById('q-options');
  optDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(i, btn);
    optDiv.appendChild(btn);
  });
}

function selectOption(idx, btn) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  const q = QUESTIONS[currentQuestion];
  q.options[idx].scores.forEach((s, i) => scores[i] += s);
  setTimeout(() => nextQuestion(), 400);
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion < QUESTIONS.length) {
    showScreen('question');
    renderQuestion();
  } else {
    showScreen('loading');
    setTimeout(() => {
      const winner = scores.indexOf(Math.max(...scores));
      showResultScreen(winner);
    }, 2200);
  }
}

function getTraitMetricsByScores(idx) {
  const p = PIKMIN[idx];
  const totalScore = scores.reduce((sum, n) => sum + n, 0);
  let values;

  if (!totalScore) {
    values = RESULT_PRESETS[p.id] || [70, 70, 70, 70, 70];
  } else {
    const raw = [
      scores[0] * 1.2 + scores[3] * 0.9 + scores[5] * 0.8,
      scores[1] * 1.2 + scores[6] * 0.9 + scores[4] * 0.4,
      scores[2] * 1.1 + scores[7] * 1.1 + scores[3] * 0.7 + scores[5] * 0.7,
      scores[4] * 1.2 + scores[7] * 0.9 + scores[2] * 0.5,
      scores[6] * 1.2 + scores[1] * 0.8 + scores[0] * 0.4
    ];
    const maxRaw = Math.max(...raw) || 1;
    values = raw.map(v => Math.max(32, Math.min(100, Math.round(v / maxRaw * 100))));
  }

  return TRAIT_LABELS.map((label, i) => ({ label, value: values[i] }));
}

function drawRadarChart(metrics, color) {
  const canvas = document.getElementById('result-radar');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2 + 8;
  const radius = 102;
  const levels = 5;
  const count = metrics.length;
  const startAngle = -Math.PI / 2;

  function pointAt(index, r) {
    const angle = startAngle + (Math.PI * 2 / count) * index;
    return { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r };
  }

  ctx.lineWidth = 1;
  for (let level = 1; level <= levels; level++) {
    const r = radius * (level / levels);
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const pt = pointAt(i, r);
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.closePath();
    ctx.fillStyle = level % 2 === 0 ? 'rgba(45,106,79,.035)' : 'rgba(45,106,79,.055)';
    ctx.strokeStyle = 'rgba(45,106,79,.14)';
    ctx.fill();
    ctx.stroke();
  }

  for (let i = 0; i < count; i++) {
    const pt = pointAt(i, radius);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(pt.x, pt.y);
    ctx.strokeStyle = 'rgba(45,106,79,.16)';
    ctx.stroke();
  }

  ctx.beginPath();
  metrics.forEach((m, i) => {
    const pt = pointAt(i, radius * (m.value / 100));
    if (i === 0) ctx.moveTo(pt.x, pt.y);
    else ctx.lineTo(pt.x, pt.y);
  });
  ctx.closePath();
  const rgb = hexToRgb(color);
  ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, .24)`;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.fill();
  ctx.stroke();

  metrics.forEach((m, i) => {
    const pt = pointAt(i, radius * (m.value / 100));
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
  });

  ctx.textAlign = 'center';
  metrics.forEach((m, i) => {
    const pt = pointAt(i, radius + 31);
    ctx.fillStyle = '#1b3a2d';
    ctx.font = '800 14px "Noto Sans TC", sans-serif';
    ctx.fillText(m.label, pt.x, pt.y + 4);
  });
}

function hexToRgb(hex) {
  const value = hex.replace('#', '');
  const full = value.length === 3 ? value.split('').map(v => v + v).join('') : value;
  const num = parseInt(full, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopyText(text));
  }
  return fallbackCopyText(text);
}

function fallbackCopyText(text) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('textarea');
    el.value = text;
    el.setAttribute('readonly', '');
    el.style.position = 'fixed';
    el.style.top = '-9999px';
    el.style.left = '-9999px';
    document.body.appendChild(el);
    el.focus();
    el.select();
    try {
      const ok = document.execCommand('copy');
      document.body.removeChild(el);
      ok ? resolve() : reject(new Error('copy failed'));
    } catch (err) {
      document.body.removeChild(el);
      reject(err);
    }
  });
}

    uploadedImages[pikminId] = ev.target.result;
    const item = document.querySelector(`.gallery-item[data-id="${pikminId}"]`);
    const img = item.querySelector('.gallery-user-img');

    img.style.display = 'block';

  };
  reader.readAsDataURL(file);
}

function openShareModal(type) {
  const p = PIKMIN[currentResultIdx];
  const inner = document.getElementById('share-card-inner');
  inner.style.background = p.color;

  // Image
  const imgWrap = document.getElementById('share-img-wrap');
  imgWrap.innerHTML = `<img class="share-card-img" src="${p.image}" alt="${p.name}" onerror="this.outerHTML='<div class=&quot;share-card-placeholder-img&quot; style=&quot;background:rgba(255,255,255,0.2)&quot;>${p.emoji}</div>'">`;

  document.getElementById('share-name-display').textContent = p.name;
  document.getElementById('share-tagline').textContent = sanitizeNoEllipsis(p.tagline);
  document.getElementById('share-overlay').classList.add('open');
}

function closeShareModal(e) {
  if (!e || e.target === document.getElementById('share-overlay')) {
    document.getElementById('share-overlay').classList.remove('open');
  }
}

async function downloadShareImage() {
  showToast('🎨 準備中...');
  try {
    const card = document.getElementById('share-card-inner');
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: PIKMIN[currentResultIdx].color,
    });
    const link = document.createElement('a');
    link.download = `我是${PIKMIN[currentResultIdx].name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✅ 圖片已下載！');
  } catch(err) {
    showToast('⚠️ 下載失敗，請截圖分享');
  }
}

function sanitizeNoEllipsis(str) {
  return (str || '').replace(/[⋯…]/g, '');
}

function getTwoLineAnalysis(text) {
  const clean = sanitizeNoEllipsis(text);
  const parts = clean.split('。').map(s => s.trim()).filter(Boolean);
  const first = parts[0] ? parts[0] + '。' : '';
  const second = parts[1] ? parts[1] + '。' : '';
  return [first, second].filter(Boolean);
}

function copyShareText() {
  const p = PIKMIN[currentResultIdx];
  const displayName = playerName || '你';
  const lines = getTwoLineAnalysis(p.desc);
  const text = `🌿 ${displayName} 的皮克敏測驗結果：${p.name}

${sanitizeNoEllipsis(p.tagline)}
${lines[0] || ''}
${lines[1] || ''}

你是哪一種皮克敏？快來測測看！`;

  copyToClipboard(text)
    .then(() => showToast('✅ 分享文字已複製！'))
    .catch(() => showToast('⚠️ 複製失敗，請手動選取文字'));
}

// ======================== TOAST ========================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>
